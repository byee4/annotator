name: Unit tests

on:
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install pytest gffutils pybedtools pandas numpy future tqdm
      - name: Run unit tests
        run: python -m pytest -q unit_tests
